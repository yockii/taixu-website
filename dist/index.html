<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030508">
  <meta name="description" content="进入太虚：面向人与 AI 协作开发的全平台编程语言。泛型、24 模块标准库、纯太虚 AOT、内置 MCP。">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/game.css">
  <title>太虚编程语言 · 进入太虚</title>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main class="world" aria-label="太虚编程语言交互式官网">
    <canvas id="universe" aria-hidden="true"></canvas>
    <div class="noise" aria-hidden="true"></div>
    <header class="hud-top">
      <button class="brand" data-scene="origin" aria-label="返回太虚之门"><img src="./assets/taixu-mark.svg" alt=""><span>太虚</span><small>TAIXU / 0.2.14</small></button>
      <div class="system-state"><i></i><span>RUNTIME ONLINE</span><b id="fps">60</b><small> FPS</small></div>
      <div class="external"><a href="./learn/">文档</a><a href="https://github.com/yockii/taixu-project">GITHUB ↗</a></div>
    </header>

    <section class="intro active" id="intro" aria-live="polite">
      <p class="kicker">PROJECT TAIXU / 太虚计划</p>
      <h1>进入<br><em>太虚</em></h1>
      <p>面向人与 AI 协作的全平台编程语言。</p>
      <button class="enter" id="enter">进入太虚世界 <span>→</span></button>
      <small>拖动视角 · 点击节点 · WASD 移动</small>
    </section>

    <aside class="content-panel" id="panel" aria-live="polite">
      <button class="panel-close" aria-label="关闭面板">×</button>
      <p class="panel-index" id="panel-index">01 / LANGUAGE</p>
      <h2 id="panel-title">一种语言，构建现代应用。</h2>
      <div id="panel-body"></div>
      <div class="panel-actions" id="panel-actions"></div>
    </aside>

    <nav class="scene-nav" aria-label="探索太虚">
      <button data-scene="language"><b>01</b><span>语言</span><small>LANGUAGE</small></button>
      <button data-scene="performance"><b>02</b><span>性能</span><small>PERFORMANCE</small></button>
      <button data-scene="ai"><b>03</b><span>AI 协作</span><small>AGENT</small></button>
      <button data-scene="learn"><b>04</b><span>学习</span><small>LEARN</small></button>
    </nav>

    <div class="hud-bottom">
      <span id="coordinates">X 000.00&nbsp;&nbsp;Y 000.00&nbsp;&nbsp;Z 009.00</span>
      <div class="progress"><i id="progress"></i></div>
      <span>TAIXU INTERACTIVE SYSTEM</span>
    </div>
    <div class="crosshair" aria-hidden="true"><i></i><i></i></div>
    <div class="loading" id="loading"><img src="./assets/taixu-mark.svg" alt=""><span>构建太虚空间</span><i></i></div>
    <div class="big-bang" id="big-bang" aria-hidden="true"></div>
    <noscript><div class="fallback"><h1>太虚编程语言</h1><p>面向人与 AI 协作的全平台编程语言。</p><a href="./learn/">阅读教程</a></div></noscript>
  </main>
  <script type="module" src="./assets/three-scene.js?v=3"></script>
</body>
</html>
